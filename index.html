<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#5b3a29">
  <title>Café Inteligente</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
